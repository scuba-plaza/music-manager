<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mm</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23282420'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='16' font-weight='bold' text-anchor='middle' fill='%23f5ae2e'%3Emm%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <header id="header">
    <div class="head-left"><span class="brand">mm</span><span class="root" id="root"></span></div>
    <div class="head-right"><span id="summary"></span><button type="button" id="sync-chip" class="chip" hidden></button><button type="button" id="theme" class="chip plain" title="Switch between the dark and the light theme" aria-label="Switch theme">◐</button></div>
  </header>
  <main id="main">
    <section class="pane" id="left" aria-label="Library">
      <h2 class="pane-title" id="left-title">Library</h2>
      <div id="filterbar"><label for="filter" class="sr-only">Filter</label><span class="prompt" aria-hidden="true">/</span><input id="filter" type="text" dir="auto" autocomplete="off" spellcheck="false" placeholder="filter  (words, status:unidentified, genre:folk)"></div>
      <div id="tree" role="tree" tabindex="0" aria-label="Library tree"></div>
    </section>
    <div id="split" role="separator" aria-orientation="vertical" aria-label="Resize the panes"></div>
    <section class="pane" id="right" aria-label="Details">
      <h2 class="pane-title" id="right-title">Details</h2>
      <div id="inspector" tabindex="-1"></div>
    </section>
  </main>
  <footer id="footer"><div id="status" role="status" aria-live="polite"></div><div id="hints"></div></footer>
  <div id="overlay-root"></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
